name: Win32 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S modding -B build-ci -A Win32

      - name: Build Release
        run: cmake --build build-ci --config Release

      - name: Run tests
        run: ctest --test-dir build-ci -C Release --output-on-failure

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build animation studio
        run: dotnet build modding/PvZAnimationStudio/PvZAnimationStudio.csproj -c Release

      - name: Test animation studio codecs and packer
        run: dotnet run --project modding/PvZAnimationStudio.Tests/PvZAnimationStudio.Tests.csproj -c Release
